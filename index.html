<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#2e2a24" />
<title>Boys &amp; Girls in Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f7f3ec; --panel:#fffdf8; --card:#fffdf9; --ink:#2e2a24; --muted:#8b8172;
    --line:#e7e0d2; --line-soft:#efe9dd; --accent:#b05c37; --accent-soft:#f0e4da;
    --gold:#a98a45; --active:#f1ebe0; --shadow:0 1px 2px rgba(46,42,36,.05),0 8px 24px rgba(46,42,36,.05);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sidebar-w:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:15px}
  a{color:inherit}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .serif{font-family:var(--serif)}
  .hidden{display:none !important}

  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--accent);
    background:transparent;color:var(--accent);border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;
    min-height:44px;transition:background .15s,color .15s,transform .05s;white-space:nowrap}
  .btn:hover{background:var(--accent);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn-solid{background:var(--accent);color:#fff}
  .btn-solid:hover{background:#95492a}
  .btn-ghost{border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:var(--active);color:var(--ink)}
  .btn-sm{padding:8px 13px;min-height:38px;border-radius:9px;font-size:13px}
  .btn-danger{border-color:#c98b7a;color:#a5502f}
  .btn-danger:hover{background:#a5502f;border-color:#a5502f;color:#fff}

  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:40px 34px;box-shadow:var(--shadow);text-align:center}
  .login-logo{width:120px;height:auto;margin:0 auto 22px;display:block;border-radius:10px}
  .login-card h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:10px 0 4px;letter-spacing:-.01em}
  .login-card .sub{color:var(--muted);margin-bottom:26px}
  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:46px;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .login-card .btn{width:100%;margin-top:6px}
  .login-alt{margin-top:20px;color:var(--muted);font-size:14px}
  .login-alt b{color:var(--accent);cursor:pointer;font-weight:600}
  .login-msg{margin-top:16px;font-size:13.5px;padding:10px 12px;border-radius:9px;display:none}
  .login-msg.err{display:block;background:#fbeae5;color:#a5502f;border:1px solid #eecabd}
  .login-msg.ok{display:block;background:#e9f1e6;color:#4a6636;border:1px solid #cfe0c4}

  #app{display:none;min-height:100%}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px;z-index:60}
  .side-logo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px;background:#fff}
  .side-logo img{width:100%;display:block}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);
    text-decoration:none;font-weight:500;font-size:14.5px;min-height:44px}
  .nav a:hover{background:var(--active)}
  .nav a.active{background:var(--active);color:var(--accent);font-weight:600}
  .nav a svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.7}
  .side-foot{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:10px}
  .side-foot .u{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .side-foot .u .avatar{width:36px;height:36px;flex:0 0 36px}
  .side-foot .u b{font-size:14px;display:block;line-height:1.2}
  .side-foot .u span{font-size:12px;color:var(--muted)}
  .side-login-link{display:block;font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer}
  .side-login-link:hover{color:var(--accent)}
  .rolechip{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-top:3px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:40}
  .topbar .tt .eyebrow{display:block}
  .topbar .tt h2{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--accent)}
  .topbar .who{display:flex;align-items:center;gap:14px}
  .topbar .who .name{text-align:right;line-height:1.25}
  .topbar .who .name b{display:block;font-size:14px}
  .topbar .who .name span{font-size:12px;color:var(--muted)}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 38px;text-transform:uppercase}
  .hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center}
  .hamb svg{width:20px;height:20px;stroke:var(--ink);stroke-width:1.9;fill:none}
  .content{padding:30px 28px 60px;max-width:1180px;width:100%}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .page-head h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em}
  .page-head p{color:var(--muted);margin-top:3px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 32px;margin-bottom:26px;box-shadow:var(--shadow)}
  .hero .eyebrow{display:block;margin-bottom:8px}
  .hero h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em}
  .hero p{color:var(--muted);margin-top:8px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);
    text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s;border-left:3px solid transparent}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(46,42,36,.10);border-left-color:var(--accent)}
  .tile .eyebrow{display:block;margin-bottom:10px}
  .tile h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
  .tile p{color:var(--muted);font-size:14px}

  .empty{color:var(--muted);text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:14px;background:var(--panel)}
  .loading{color:var(--muted);text-align:center;padding:40px}

  .cal-nav{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .cal-nav button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;color:var(--ink)}
  .cal-nav button:hover{background:var(--active)}
  .cal-nav .m{font-family:var(--serif);font-size:22px;font-weight:600;min-width:180px;text-transform:capitalize}
  .cal-wrap{overflow-x:auto}
  .cal{width:100%;border-collapse:collapse;min-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cal th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
  .cal td{border:1px solid var(--line-soft);vertical-align:top;height:96px;width:14.28%;padding:7px;position:relative}
  .cal td.off{background:#faf7f1}
  .cal .dnum{font-size:13px;color:var(--muted);font-weight:500}
  .cal td.today .dnum{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
  .ev{margin-top:5px;font-size:11.5px;padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:#8a3f22;
    border-left:3px solid var(--accent);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.g{background:#eef1e6;color:#5a6636;border-left-color:#8a9a52}
  .ev.b{background:#e9eef2;color:#3f5666;border-left-color:#6f93a8}

  .list{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
  .row .ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
  .row .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
  .row .meta{flex:1;min-width:0}
  .row .meta b{font-size:15.5px;display:block}
  .row .meta span{color:var(--muted);font-size:13px}
  .row .acts{display:flex;gap:8px;flex-shrink:0}

  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .vthumb{position:relative;aspect-ratio:16/9;background:#2e2a24;overflow:hidden}
  .vthumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
  .vthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .vthumb .play span{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
  .vthumb .play svg{width:22px;height:22px;fill:var(--accent);margin-left:3px}
  .vbody{padding:16px 18px}
  .vbody b{font-size:15.5px;display:block;margin-bottom:4px}
  .vbody span{color:var(--muted);font-size:13px}
  .vbody .acts{margin-top:12px;display:flex;gap:8px}

  .verse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .verse{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column}
  .verse .art{padding:34px 22px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:210px}
  .verse .ref{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.85}
  .verse .txt{font-family:var(--serif);font-size:18px;line-height:1.4}
  .verse .icon{font-size:20px;opacity:.8}
  .verse .acts{display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
  .verse .acts .btn{flex:1}
  .v-dark{background:#302b25;color:#f3ece0}
  .v-rust{background:#6f4a24;color:#f6ead9}
  .v-cream{background:#efe7d7;color:#4a4335}
  .v-sage{background:#e4e9db;color:#414a34}
  .v-sky{background:#dfe7ec;color:#3a4c58}
  .v-plum{background:#e7dde4;color:#4f3f4c}

  .composer{display:flex;gap:12px;margin-bottom:22px}
  .composer textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 15px;resize:vertical;min-height:52px;background:#fff}
  .composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .post{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:12px;box-shadow:var(--shadow)}
  .post .ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .post .ph .avatar{width:34px;height:34px;flex:0 0 34px;font-size:13px}
  .post .ph b{font-size:14.5px}
  .post .ph span{font-size:12px;color:var(--muted)}
  .post .body{font-size:14.5px;white-space:pre-wrap}
  .post .del{margin-left:auto}

  .overlay{position:fixed;inset:0;background:rgba(38,34,28,.5);backdrop-filter:blur(2px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:18px;width:100%;max-width:460px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
  .modal h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:18px}
  .modal .field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;min-height:80px;resize:vertical;background:#fff}
  .modal .field input,.modal .field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:46px}
  .modal-acts{display:flex;gap:10px;margin-top:22px}
  .modal-acts .btn{flex:1}

  .backdrop{position:fixed;inset:0;background:rgba(38,34,28,.45);z-index:55;display:none}
  .backdrop.show{display:block}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:300;color:var(--muted)}

  @media(max-width:900px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.15)}
    .sidebar.open{transform:translateX(0)}
    .hamb{display:flex}
    .topbar{padding:14px 16px}
    .content{padding:22px 16px 60px}
    .topbar .who .name{display:none}
    .hero{padding:24px 20px}
    .hero h1{font-size:27px}
    .page-head h1{font-size:25px}
    .grid{grid-template-columns:1fr}
    .vgrid{grid-template-columns:1fr}
    .verse-grid{grid-template-columns:1fr 1fr}
    .row{flex-wrap:wrap}
    .row .acts{width:100%;justify-content:flex-end}
    .composer{flex-direction:column}
    .composer .btn{width:100%}
  }
  @media(max-width:560px){
    .verse-grid{grid-template-columns:1fr}
    .hero h1{font-size:24px}
    .page-head{flex-direction:column}
    .page-head .btn{width:100%}
  }
  @media print{
    .sidebar,.topbar,.backdrop,.page-head .btn,.verse .acts{display:none !important}
    .content{padding:0}
    .verse-grid{grid-template-columns:1fr 1fr}
    body{background:#fff}
  }
</style>
</head>
<body>

<div id="boot">Cargando…</div>

<!-- ============ LOGIN ============ -->
<div id="login" style="display:none">
  <div class="login-card">
    <img class="login-logo" alt="Boys & Girls in Mission" src="public/bgm-logo.jpg" />
    <div class="eyebrow">Escuela Bíblica</div>
    <h1 class="serif">Boys &amp; Girls in Mission</h1>
    <div class="sub" id="authSub">Equipo de maestros</div>
    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label>Nombre y apellido</label>
        <input type="text" id="liName" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="liEmail" placeholder="tu@correo.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="liPass" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn btn-solid" type="submit" id="authBtn">Ingresar</button>
    </form>
    <div class="login-msg" id="authMsg"></div>
    <div class="login-alt" id="authToggle">¿No tenés cuenta? <b>Registrate</b></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="backdrop" id="backdrop"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-logo"><img alt="Boys & Girls in Mission" src="public/bgm-logo.jpg" /></div>
      <nav class="nav" id="nav">
        <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
        <a href="#calendario" data-v="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Calendario</a>
        <a href="#recursos" data-v="recursos"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/></svg>Recursos</a>
        <a href="#videos" data-v="videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>Videos</a>
        <a href="#versiculos" data-v="versiculos"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 6l7 3 7-3M5 18l7 3 7-3M5 6v12M19 6v12"/></svg>Versículos</a>
        <a href="#comentarios" data-v="comentarios"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Comentarios</a>
      </nav>
      <div class="side-foot">
        <div class="u">
          <div class="avatar" id="sideAvatar">?</div>
          <div><b id="sideName">—</b><span class="rolechip" id="sideRole">maestro</span></div>
        </div>
        <a class="side-login-link" id="logout">Cerrar sesión →</a>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="hamb" id="hamb" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="tt">
            <span class="eyebrow">Boys &amp; Girls in Mission</span>
            <h2 class="serif" id="pageTitle">Inicio</h2>
          </div>
        </div>
        <div class="who">
          <div class="name"><b id="topName">—</b><span id="topRole">—</span></div>
          <div class="avatar" id="topAvatar">?</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL='https://eywcwxqlmwfaajuktejj.supabase.co';
  var SUPABASE_KEY='sb_publishable_2FHlF3ExfS_af3guJWK3gw_GRYotm9Y';
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var WD=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var THEMES=[['v-dark','Oscuro'],['v-rust','Tierra'],['v-cream','Crema'],['v-sage','Verde'],['v-sky','Azul'],['v-plum','Lila']];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(d){var x=new Date(d);return x.getDate()+' '+MONTHS[x.getMonth()].slice(0,3)+' '+x.getFullYear();}
  function ago(ts){var s=(Date.now()-new Date(ts).getTime())/1000;if(s<60)return'hace instantes';if(s<3600)return'hace '+Math.floor(s/60)+' min';if(s<86400)return'hace '+Math.floor(s/3600)+' h';return'hace '+Math.floor(s/86400)+' días';}

  var calY=new Date().getFullYear(),calM=new Date().getMonth();
  async function renderCalendario(){
    loading();var admin=isAdmin();
    var start=new Date(calY,calM,1).toISOString().slice(0,10);
    var end=new Date(calY,calM+1,1).toISOString().slice(0,10);
    var r=await sb.from('events').select('*').gte('event_date',start).lt('event_date',end);
    var events=r.data||[];
    var head='<div class="page-head"><div><h1 class="serif">Calendario</h1><p>Actividades y recordatorios del equipo.</p></div>'+
      (admin?'<button class="btn btn-solid" id="addEv">+ Nueva actividad</button>':'')+'</div>';
    var first=new Date(calY,calM,1).getDay(),days=new Date(calY,calM+1,0).getDate();
    var today=new Date(),isThis=(today.getFullYear()===calY&&today.getMonth()===calM);
    var cells=[];for(var i=0;i<first;i++)cells.push(null);for(var d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(null);
    var rows='';
    for(var rr=0;rr<cells.length;rr+=7){rows+='<tr>';
      for(var c=0;c<7;c++){var day=cells[rr+c];
        if(day===null){rows+='<td class="off"></td>';continue;}
        var dayEv=events.filter(function(e){return parseInt(e.event_date.slice(8,10),10)===day;});
        var evH=dayEv.map(function(e){return '<div class="ev '+colorClass(e.category)+'" data-ev="'+e.id+'" title="'+esc(e.title)+'">'+esc(e.title)+'</div>';}).join('');
        rows+='<td class="'+(isThis&&day===today.getDate()?'today':'')+'"><span class="dnum">'+day+'</span>'+evH+'</td>';
      }rows+='</tr>';}
    C.innerHTML=head+'<div class="cal-nav"><button id="pm">‹</button><div class="m serif">'+MONTHS[calM]+' '+calY+'</div><button id="nm">›</button></div>'+
      '<div class="cal-wrap"><table class="cal"><thead><tr>'+WD.map(function(w){return '<th>'+w.toUpperCase()+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
    document.getElementById('pm').onclick=function(){calM--;if(calM<0){calM=11;calY--;}renderCalendario();};
    document.getElementById('nm').onclick=function(){calM++;if(calM>11){calM=0;calY++;}renderCalendario();};
    if(admin)document.getElementById('addEv').onclick=function(){evModal(null,events);};
    C.querySelectorAll('[data-ev]').forEach(function(el){el.onclick=function(){var e=events.filter(function(x){return x.id===el.getAttribute('data-ev');})[0];evModal(e,events);};});
  }

    var dv=ev?ev.event_date.slice(0,10):new Date(calY,calM,Math.min(new Date().getDate(),28)).toISOString().slice(0,10);

      '<div class="field"><label>Fecha</label><input type="date" id="evDate" value="'+dv+'"/></div>'+
      '<div class="field"><label>Color</label><select id="evType"><option value="a">Terracota</option><option value="g">Verde</option><option value="b">Azul</option></select></div>'+
      '<div class="modal-acts">'+(ev?'<button class="btn btn-danger" id="evDel">Borrar</button>':'')+'<button class="btn btn-ghost" onclick="BGM.closeModal()">Cancelar</button><button class="btn btn-solid" id="evSave">Guardar</button></div>');

  }

    var r=await sb.from('comments').select('*').order('created_at',{ascending:false});
    var posts=r.data||[];var wall=document.getElementById('wall');if(!wall)return;
    if(!posts.length){wall.innerHTML='<div class="empty">Sé el primero en escribir en el muro.</div>';return;}
    wall.innerHTML=posts.map(function(p){
      var name=PROFILES[p.author_id]||'Miembro del equipo';
      var canDel=isAdmin()||p.author_id===ME.id;
      return '<div class="post"><div class="ph"><div class="avatar">'+esc(name.charAt(0))+'</div><div><b>'+esc(name)+'</b><span> · '+ago(p.created_at)+'</span></div>'+
        (canDel?'<button class="btn btn-danger btn-sm del" data-del="'+p.id+'">Borrar</button>':'')+'</div><div class="body">'+esc(p.body)+'</div></div>';
    }).join('');
    wall.querySelectorAll('[data-del]').forEach(function(b){b.onclick=async function(){var res=await sb.from('comments').delete().eq('id',b.getAttribute('data-del'));if(res.error){toast('Error: '+res.error.message);return;}loadWall();toast('Borrado');};});
  }

  /* ---------- Boot ---------- */
  sb.auth.getSession().then(function(r){
    if(r.data.session){enterApp();}else{showLogin();}
  }).catch(function(){showLogin();});
})();
</script>
</body>
</html>
